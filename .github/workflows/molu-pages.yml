name: Publish complete Molu portfolio
on:
  push:
    branches: [main]
    paths:
      - 'molu-portfolio/**'
      - '.github/workflows/molu-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: molu-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install image preview support
        run: python -m pip install Pillow
      - name: Assemble and verify original media
        run: python molu-portfolio/.publish/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for artifact metadata
        run: sleep 30
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
